<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M50 8L82 20V45C82 66.5 68.4 84.8 50 92C31.6 84.8 18 66.5 18 45V20L50 8Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#medGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"/>
  <!-- Internal Medical Cross -->
  <rect x="44" y="28" width="12" height="34" rx="3" fill="url(#medGrad)" filter="url(#glow)"/>
  <rect x="33" y="39" width="34" height="12" rx="3" fill="url(#medGrad)" filter="url(#glow)"/>
  <!-- EKG Vital Pulse Line overlay -->
  <path d="M26 45H38L42 36L46 54L52 32L56 50L60 45H74" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
